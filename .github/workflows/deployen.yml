# Deployment auf das All-Inkl-Webhosting über SSH.
#
# Läuft bei jedem Push auf main — aber erst, wenn alle Prüfungen grün sind.
# Zusätzlich jederzeit von Hand auslösbar unter Actions → Deployen → Run workflow.
#
# Übertragen wird per rsync über SSH: schneller als FTP, weil nur Geändertes
# geht, und die Migrationen laufen direkt auf dem Server. Dadurch braucht es
# keinen Migrationsendpunkt im Netz — DEPLOY_TOKEN kann in der .env leer
# bleiben, dann ist /deploy/migrieren vollständig gesperrt.

name: Deployen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrationen:
        description: 'Datenbank-Migrationen nach dem Upload ausführen'
        type: boolean
        default: true

# Zwei gleichzeitige Deployments würden sich auf dem Server überschreiben.
# Deshalb NICHT abbrechen, sondern anstellen und nacheinander ausführen.
concurrency:
  group: deployen-produktion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Rote Tests blockieren das Deployment. Ohne diese Kopplung wäre die
  # Automatik gefährlicher als Handarbeit.
  pruefen:
    name: Prüfungen
    uses: ./.github/workflows/pruefen.yml

  deployen:
    name: Auf den Server bringen
    needs: pruefen
    runs-on: ubuntu-latest

    steps:
      # Zuerst prüfen, ob überhaupt alles da ist. Ohne diesen Schritt
      # scheitert der Lauf irgendwo in der Mitte mit einer Meldung, aus der
      # nicht hervorgeht, welches Geheimnis fehlt.
      - name: Voraussetzungen prüfen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_BENUTZER: ${{ secrets.SSH_BENUTZER }}
          SSH_ZIEL: ${{ secrets.SSH_ZIEL }}
          SSH_SCHLUESSEL: ${{ secrets.SSH_SCHLUESSEL }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
          SEITE_URL: ${{ secrets.SEITE_URL }}
        run: |
          fehlt=""
          for name in SSH_HOST SSH_BENUTZER SSH_ZIEL SSH_SCHLUESSEL SEITE_URL; do
            if [ -z "${!name}" ]; then
              fehlt="${fehlt} ${name}"
            else
              echo "  vorhanden: ${name}"
            fi
          done

          if [ -z "${SSH_FINGERPRINT}" ]; then
            echo "  HINWEIS: SSH_FINGERPRINT fehlt — der Server wird dann nicht überprüft."
          else
            echo "  vorhanden: SSH_FINGERPRINT"
          fi

          if [ -n "${fehlt}" ]; then
            echo
            echo "FEHLER: Diese Geheimnisse fehlen:${fehlt}"
            echo
            echo "Anzulegen unter Settings → Secrets and variables → Actions."
            echo "Welcher Wert wohin gehört, steht in deployment/README.md."
            exit 1
          fi

          # Der private Schlüssel muss vollständig sein — ein häufiger Fehler
          # ist, nur die mittlere Zeile zu kopieren oder den öffentlichen zu
          # erwischen.
          if ! echo "${SSH_SCHLUESSEL}" | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "FEHLER: SSH_SCHLUESSEL sieht nicht nach einem privaten Schlüssel aus."
            echo "Erwartet wird der Inhalt der Datei OHNE .pub am Ende,"
            echo "beginnend mit '-----BEGIN OPENSSH PRIVATE KEY-----'."
            exit 1
          fi

          echo
          echo "Alle Voraussetzungen erfüllt."

      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Paket bauen
        # Produktiv hat die Anwendung keine externen Abhängigkeiten — der
        # eigene Klassenlader ersetzt Composer. Mit --no-dev ist PHPUnit nicht
        # vorhanden, das Skript überspringt die Tests deshalb von selbst; sie
        # liefen bereits im Prüf-Job.
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --quiet
          ./deployment/paket-bauen.sh
          echo "Dateien: $(find deployment/upload -type f | wc -l)"
          echo "Größe:   $(du -sh deployment/upload | cut -f1)"

      - name: SSH-Schlüssel laden
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_SCHLUESSEL }}

      - name: Serverschlüssel prüfen und festschreiben
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          # SHA256-Fingerprint aus dem KAS-Adminbereich unter SSH-Zugriff.
          # Damit wird der Server überprüft, statt seinen Schlüssel blind
          # anzunehmen — sonst wäre die Verbindung gegen einen
          # zwischengeschalteten Angreifer ungeschützt.
          ERWARTETER_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          ssh-keyscan -t ed25519 -p 22 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          gefunden=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          echo "Fingerprint des Servers: $gefunden"

          if [ -z "${ERWARTETER_FINGERPRINT}" ]; then
            echo "WARNUNG: SSH_FINGERPRINT ist nicht gesetzt — der Server wird nicht überprüft."
            echo "Den Wert findest du im KAS-Adminbereich unter SSH-Zugriff (ED25519, SHA256)."
            exit 0
          fi

          if [ "$gefunden" != "$ERWARTETER_FINGERPRINT" ]; then
            echo "FEHLER: Der Server meldet einen anderen Schlüssel als erwartet."
            echo "  erwartet: $ERWARTETER_FINGERPRINT"
            echo "  gefunden: $gefunden"
            exit 1
          fi
          echo "Server überprüft."

      - name: Zielverzeichnis absichern
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_BENUTZER: ${{ secrets.SSH_BENUTZER }}
          SSH_ZIEL: ${{ secrets.SSH_ZIEL }}
        run: |
          set -euo pipefail

          # Der nächste Schritt löscht mit --delete alles im Ziel, was nicht
          # zum Paket gehört. Zeigt SSH_ZIEL versehentlich auf ein Verzeichnis
          # mit anderen Inhalten — etwa das Web-Stammverzeichnis des ganzen
          # Kontos — wären die unwiederbringlich weg.
          #
          # Deshalb: übertragen wird nur in ein Verzeichnis, das leer ist,
          # nicht existiert, oder aus einem früheren Deployment stammt.
          zustand=$(ssh "${SSH_BENUTZER}@${SSH_HOST}" "
            ziel='${SSH_ZIEL}'
            if [ ! -d \"\$ziel\" ]; then echo neu; exit 0; fi
            if [ -f \"\$ziel/.meinslip-deploy\" ]; then echo bekannt; exit 0; fi
            if [ -z \"\$(ls -A \"\$ziel\" 2>/dev/null)\" ]; then echo leer; exit 0; fi
            echo fremd
          ")

          echo "Zustand des Zielverzeichnisses: ${zustand}"

          case "${zustand}" in
            neu|leer|bekannt)
              echo "Übertragung ist sicher."
              ;;
            *)
              echo
              echo "FEHLER: '${SSH_ZIEL}' enthält Dateien, die nicht von einem"
              echo "früheren Deployment stammen. Die Übertragung würde sie löschen."
              echo
              echo "Inhalt:"
              ssh "${SSH_BENUTZER}@${SSH_HOST}" "ls -A '${SSH_ZIEL}' | head -20"
              echo
              echo "Prüfe, ob SSH_ZIEL auf das richtige Verzeichnis zeigt."
              echo "Ist es das richtige und der Inhalt darf weg, lege dort einmalig"
              echo "eine leere Datei .meinslip-deploy an."
              exit 1
              ;;
          esac

      - name: Übertragen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_BENUTZER: ${{ secrets.SSH_BENUTZER }}
          SSH_ZIEL: ${{ secrets.SSH_ZIEL }}
        run: |
          set -euo pipefail

          # Kennzeichnet das Verzeichnis als unseres — die Absicherung oben
          # erkennt es beim nächsten Lauf daran wieder.
          touch ./deployment/upload/.meinslip-deploy

          # --delete räumt entfernte Dateien auf dem Server auf.
          # Die Ausschlüsse sind lebenswichtig: .env enthält die
          # Datenbankzugänge und lebt auf dem Server, storage/ die Protokolle
          # und hochgeladenen Dateien. Würde eines davon gelöscht, wäre die
          # Seite sofort tot beziehungsweise Daten verloren.
          rsync -rlvz --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='.git*' \
            --exclude='vendor/' \
            ./deployment/upload/ \
            "${SSH_BENUTZER}@${SSH_HOST}:${SSH_ZIEL}/"

      - name: Verzeichnisse anlegen und Rechte setzen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_BENUTZER: ${{ secrets.SSH_BENUTZER }}
          SSH_ZIEL: ${{ secrets.SSH_ZIEL }}
        run: |
          ssh "${SSH_BENUTZER}@${SSH_HOST}" \
            "mkdir -p '${SSH_ZIEL}/storage/logs' '${SSH_ZIEL}/storage/uploads' && chmod -R 775 '${SSH_ZIEL}/storage'"

      - name: Konfiguration auf dem Server prüfen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_BENUTZER: ${{ secrets.SSH_BENUTZER }}
          SSH_ZIEL: ${{ secrets.SSH_ZIEL }}
        run: |
          set -euo pipefail

          # Die .env wird bewusst NICHT übertragen — sie lebt auf dem Server
          # und enthält die Datenbankzugänge. Beim allerersten Deployment
          # existiert sie deshalb noch nicht, und die Migrationen würden mit
          # einer wenig hilfreichen Meldung scheitern.
          if ssh "${SSH_BENUTZER}@${SSH_HOST}" "test -f '${SSH_ZIEL}/.env'"; then
            echo "Die .env ist vorhanden."
            exit 0
          fi

          echo "Auf dem Server fehlt noch die .env — das ist beim ersten Deployment normal."
          echo
          echo "Die Dateien liegen jetzt unter ${SSH_ZIEL}. Es fehlen drei Schritte:"
          echo
          echo "  1. Im KAS-Adminbereich eine MySQL-Datenbank anlegen."
          echo
          echo "  2. Per SSH verbinden und die .env aus der Vorlage erstellen:"
          echo "       cd ${SSH_ZIEL}"
          echo "       cp .env.BEISPIEL .env"
          echo "       nano .env"
          echo "     Auszufüllen: DB_NAME, DB_BENUTZER, DB_PASSWORT, APP_SCHLUESSEL."
          echo "     Schlüssel erzeugen mit:"
          echo "       php -r \"echo bin2hex(random_bytes(32)), PHP_EOL;\""
          echo
          echo "  3. Im KAS-Adminbereich unter Domains das Verzeichnis der Domain"
          echo "     auf ${SSH_ZIEL}/public zeigen lassen."
          echo "     Ohne diesen Schritt lägen .env und app/ offen im Netz."
          echo
          echo "Danach dieses Deployment erneut auslösen — dann laufen die"
          echo "Migrationen durch und die Betriebsprüfung wird grün."
          exit 1

      - name: Migrationen ausführen
        if: ${{ github.event_name == 'push' || inputs.migrationen }}
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_BENUTZER: ${{ secrets.SSH_BENUTZER }}
          SSH_ZIEL: ${{ secrets.SSH_ZIEL }}
        run: |
          set -euo pipefail
          ssh "${SSH_BENUTZER}@${SSH_HOST}" "cd '${SSH_ZIEL}' && php bin/migrate"

      - name: Betriebsprüfung
        env:
          SEITE: ${{ secrets.SEITE_URL }}
          SCHUTZ_BENUTZER: ${{ secrets.SCHUTZ_BENUTZER }}
          SCHUTZ_PASSWORT: ${{ secrets.SCHUTZ_PASSWORT }}
        run: |
          set -euo pipefail

          # Der Verzeichnisschutz antwortet sonst mit 401 — auch uns gegenüber.
          auth=()
          if [ -n "${SCHUTZ_BENUTZER}" ]; then
            auth=(--user "${SCHUTZ_BENUTZER}:${SCHUTZ_PASSWORT}")
          fi

          # Nach dem Übertragen braucht der Server manchmal einen Moment.
          for versuch in 1 2 3 4 5; do
            if antwort=$(curl -sS --fail-with-body --max-time 20 "${auth[@]}" "${SEITE}/zustand"); then
              echo "$antwort"
              if echo "$antwort" | grep -q '"hauptbuch":"ausgeglichen"'; then
                echo "Betrieb in Ordnung."
                exit 0
              fi
              echo "Antwort noch nicht in Ordnung."
            fi
            echo "Versuch ${versuch} fehlgeschlagen, warte 10 Sekunden."
            sleep 10
          done

          echo "FEHLER: Die Seite meldet nach dem Deployment keinen gesunden Zustand."
          exit 1

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "## Deployment"
            echo
            echo "| Feld | Wert |"
            echo "| :--- | :--- |"
            echo "| Ergebnis | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Ausgelöst durch | ${{ github.event_name }} |"
            echo
            echo "Betriebsprüfung: \`/zustand\`"
          } >> "$GITHUB_STEP_SUMMARY"
