<nav style="display:flex;align-items:stretch;gap:2px;padding:8px 6px 34px;background:#1b1d2b;border-top:1px solid rgba(233,233,237,0.10);font-family:Inter,system-ui,sans-serif">

  <a href="#f-discover" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;min-height:44px;text-decoration:none;border-radius:10px;color: {{ cDisc }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M14.9 9.1 13.4 13.4 9.1 14.9l1.5-4.3z"></path></svg>

  </a>
  <a href="#f-wallet" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;min-height:44px;text-decoration:none;border-radius:10px;color: {{ cWallet }}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12.5" rx="2.5"></rect><path d="M3 10h18"></path><circle cx="16.6" cy="14.2" r="1.1" fill="currentColor" stroke="none"></circle></svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;discover&quot;,&quot;chat&quot;,&quot;wallet&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const on = '#b5abfc', off = '#75798c';
    const c = k => (k === active ? on : off);
    return { cHome: c('home'), cDisc: c('discover'), cChat: c('chat'), cWallet: c('wallet'), cProfile: c('profile') };
  }
}
</script>
